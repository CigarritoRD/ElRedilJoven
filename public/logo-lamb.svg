<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <radialGradient id="woolLight" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="woolDark" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="72" rx="18" ry="4" fill="rgba(0,0,0,0.2)"/>

  <!-- Wool body (main fluffy shape) -->
  <circle cx="40" cy="42" r="22" fill="url(#woolLight)"/>
  <circle cx="28" cy="38" r="10" fill="url(#woolDark)"/>
  <circle cx="52" cy="38" r="10" fill="url(#woolDark)"/>
  <circle cx="32" cy="30" r="8" fill="#e0f2fe"/>
  <circle cx="48" cy="30" r="8" fill="#e0f2fe"/>
  <circle cx="40" cy="26" r="9" fill="#f0f9ff"/>
  <circle cx="25" cy="44" r="7" fill="url(#woolDark)"/>
  <circle cx="55" cy="44" r="7" fill="url(#woolDark)"/>
  <circle cx="30" cy="50" r="6" fill="#7dd3fc"/>
  <circle cx="50" cy="50" r="6" fill="#7dd3fc"/>

  <!-- Ears -->
  <ellipse cx="20" cy="36" rx="7" ry="5" fill="#0ea5e9" transform="rotate(-20 20 36)"/>
  <ellipse cx="60" cy="36" rx="7" ry="5" fill="#0ea5e9" transform="rotate(20 60 36)"/>
  <ellipse cx="20" cy="36" rx="4" ry="2.5" fill="#38bdf8" transform="rotate(-20 20 36)"/>
  <ellipse cx="60" cy="36" rx="4" ry="2.5" fill="#38bdf8" transform="rotate(20 60 36)"/>

  <!-- Face background -->
  <ellipse cx="40" cy="42" rx="14" ry="13" fill="url(#faceGrad)"/>

  <!-- Wool texture spots on face -->
  <circle cx="30" cy="34" r="4" fill="#bae6fd" opacity="0.9"/>
  <circle cx="50" cy="34" r="4" fill="#bae6fd" opacity="0.9"/>

  <!-- Eyes -->
  <circle cx="34" cy="40" r="3.5" fill="#0c4a6e"/>
  <circle cx="46" cy="40" r="3.5" fill="#0c4a6e"/>
  <circle cx="35" cy="39" r="1.2" fill="white"/>
  <circle cx="47" cy="39" r="1.2" fill="white"/>

  <!-- Nose/snout -->
  <ellipse cx="40" cy="48" rx="5" ry="3.5" fill="#7dd3fc"/>
  <ellipse cx="38" cy="48" rx="1.5" ry="1" fill="#38bdf8"/>
  <ellipse cx="42" cy="48" rx="1.5" ry="1" fill="#38bdf8"/>

  <!-- Mouth -->
  <path d="M37 51 Q40 54 43 51" stroke="#0ea5e9" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="28" cy="45" r="4" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="52" cy="45" r="4" fill="#7dd3fc" opacity="0.5"/>

  <!-- Horns (small lamb horns) -->
  <path d="M24 28 Q20 22 24 18" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M56 28 Q60 22 56 18" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Front legs -->
  <rect x="32" y="60" width="6" height="10" rx="3" fill="#0ea5e9"/>
  <rect x="42" y="60" width="6" height="10" rx="3" fill="#0ea5e9"/>
  <ellipse cx="35" cy="70" rx="4" ry="2" fill="#0284c7"/>
  <ellipse cx="45" cy="70" rx="4" ry="2" fill="#0284c7"/>
</svg>
